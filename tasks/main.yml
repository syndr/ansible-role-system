---

- name: Validate role configuration
  tags: always
  ansible.builtin.include_tasks: validate_conf.yml

- name: Validate remote Python environment
  tags: always
  vars:
    ansible_python_interpreter: "{{ system_python_bootstrap_interpreter | default('auto') }}"
  ansible.builtin.include_tasks: validate_env.yml

- name: Manage Python virtual environments
  tags: system-venv
  vars:
    # Use bootstrap interpreter if defined, otherwise fall back to Ansible's auto-discovery
    # Note: variable precedence is of particular importance for this to work
    #   see: https://docs.ansible.com/ansible/latest/playbook_guide/playbooks_variables.html#understanding-variable-precedence
    ansible_python_interpreter: "{{ system_python_bootstrap_interpreter | default('auto') }}"
  block:
    - name: Override ansible_python_interpreter for bootstrap
      when:
        - system_venv_set_interpreter
        - system_python_bootstrap_interpreter | default('') is truthy
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ system_python_bootstrap_interpreter }}"

    - name: "DEBUG: Show bootstrap python interpreter configuration"
      ansible.builtin.debug:
        msg: |
          Bootstrap interpreter: "{{ system_python_bootstrap_interpreter | default('UNDEFINED') }}"
          Ansible interpreter: "{{ ansible_python_interpreter | default('auto') }}"
        verbosity: 1

    - name: Gather some host facts (with bootstrap interpreter)
      ansible.builtin.setup:
        filter:
          - 'ansible_date_time'
          - 'ansible_distribution*'
          - 'ansible_os_family'
          - 'ansible_*_mb'
          - 'ansible_env'
          - 'ansible_pkg_mgr'

    - name: Discover package manager Python interpreter
      ansible.builtin.include_tasks: discover-pkg-mgr-python.yml

    - name: Install venv system dependencies
      when: system_enable_venv
      ansible.builtin.include_tasks:
        file: packages-venv-deps.yml
      vars:
        ansible_python_interpreter: "{{ __system_pkg_mgr_interpreter }}"

    - name: Configure Python virtual environment
      when: system_enable_venv
      ansible.builtin.include_tasks: packages-venv.yml

- name: Deploy configuration dependencies
  tags:
    - system-utils
    - system-packages
  when: system_enable_utils
  ansible.builtin.include_tasks: utilities.yml

# NOTE This assumes that the name of the host in the inventory file is the hostname by default
- name: Set system hostname
  tags: system-hostname
  when: system_enable_hostname
  ansible.builtin.include_tasks: hostname.yml

# Do this early, for more breadcrumbs if something later fails 💡
- name: Set MOTD
  tags: system-motd
  when: system_enable_motd
  block:
    - name: Set Message of the Day
      ansible.builtin.include_tasks: "{{ role_path }}/tasks/motd.yml"

- name: Kernel options and the like
  tags: system-kernel
  when: system_enable_kernel
  block:
    - name: Configure sysctl settings
      ansible.builtin.include_tasks: sysctl.yml

- name: Configure applications with package managers
  tags: system-packages
  when: system_enable_packages
  block:
    - name: Load system package defaults
      ansible.builtin.include_tasks: packages-load-defaults.yml

    - name: Configure global package manager settings
      ansible.builtin.include_tasks:
        file: package-manager.yml
      vars:
        ansible_python_interpreter: "{{ __system_pkg_mgr_interpreter }}"

    - name: Install system packages
      ansible.builtin.include_tasks:
        file: packages.yml
      vars:
        ansible_python_interpreter: "{{ __system_pkg_mgr_interpreter }}"

- name: Install pip3 packages
  tags: system-pip-packages
  when: system_enable_pip_packages
  block:
    - name: Install pip3 packages
      when: system_packages_pip3_base is truthy
      ansible.builtin.include_tasks: packages-pip3.yml

- name: Configure services
  tags: system-services
  when: system_enable_services
  block:
    - name: Configure systemd services
      ansible.builtin.include_tasks: services.yml

- name: Configure cron jobs
  tags: system-cron
  when: system_enable_cron
  block:
    - name: Configure cron jobs
      ansible.builtin.include_tasks: cron.yml

- name: Configure shells
  tags: system-shell
  when: system_enable_shell
  block:
    - name: Configure global PATH
      ansible.builtin.include_tasks: path.yml

    - name: Configure bash shell
      ansible.builtin.include_tasks: bash.yml

- name: Configure logging
  tags: system-logging
  when: system_enable_logging
  block:
    - name: Configure system logging
      ansible.builtin.include_tasks: logging.yml

- name: Configure timezone
  tags: system-timezone
  when: system_enable_timezone
  block:
    - name: Configure system timezone
      ansible.builtin.include_tasks: timezone.yml

- name: Configure alternatives
  tags: system-alternatives
  when: system_enable_alternatives
  block:
    - name: Configure system alternatives
      ansible.builtin.include_tasks: alternatives.yml

# We always do this unless it is explicitly disabled via tags
- name: Store system configuration data
  tags:
    - always
    - system-facts
  ansible.builtin.include_tasks: ansible-facts.yml
