---
# Manage Python virtual environments for Ansible and system automation
# NOTE: System package dependencies (dnf/yum/apt) are handled separately
# in packages-venv-deps.yml with the package manager Python interpreter.

- name: Check if venv already exists
  ansible.builtin.stat:
    path: "{{ system_venv_path }}"
  register: __system_venv_exists

- name: Create Python virtual environment
  when: not __system_venv_exists.stat.exists
  become: true
  vars:
    # Pip is needed for managing packages; ensure it's installed
    __system_pip_package_state: >-
      {{
        system_venv_packages_state
        if system_venv_packages_state in ['present', 'latest']
        else
        'present'
      }}
  ansible.builtin.pip:
    name: pip
    state: "{{ __system_pip_package_state }}"
    virtualenv: "{{ system_venv_path }}"
    virtualenv_command: "{{ system_venv_python_cmd }} -m venv"
    virtualenv_site_packages: "{{ system_venv_site_packages }}"

- name: Set virtual environment ownership
  when: not __system_venv_exists.stat.exists
  become: true
  ansible.builtin.file:
    path: "{{ system_venv_path }}"
    owner: "{{ system_venv_owner }}"
    group: "{{ system_venv_group }}"
    mode: "{{ system_venv_mode }}"
    state: directory
    recurse: true

- name: Ensure system site-packages access in existing venv
  when:
    - __system_venv_exists.stat.exists
    - system_venv_site_packages
  become: true
  ansible.builtin.lineinfile:
    path: "{{ system_venv_path }}/pyvenv.cfg"
    regexp: '^include-system-site-packages'
    line: 'include-system-site-packages = true'

- name: Ensure packaging library is available in venv (required by ansible.builtin.pip)
  become: true
  ansible.builtin.command:
    cmd: "{{ system_venv_path }}/bin/pip install packaging"
  register: __system_venv_packaging
  changed_when: "'Successfully installed' in __system_venv_packaging.stdout"

- name: Install base packages in virtual environment
  when: system_venv_packages_base | length > 0
  become: true
  ansible.builtin.pip:
    name: "{{ system_venv_packages_base }}"
    state: "{{ system_venv_packages_state }}"
    virtualenv: "{{ system_venv_path }}"

- name: Install extra packages in virtual environment
  when: system_venv_packages_extra | length > 0
  become: true
  ansible.builtin.pip:
    name: "{{ system_venv_packages_extra }}"
    state: "{{ system_venv_packages_state }}"
    virtualenv: "{{ system_venv_path }}"

- name: Remove packages from virtual environment
  when: system_venv_packages_remove | length > 0
  become: true
  ansible.builtin.pip:
    name: "{{ system_venv_packages_remove }}"
    state: absent
    virtualenv: "{{ system_venv_path }}"

- name: Set runtime python interpreter
  when: system_venv_set_interpreter
  block:
    - name: Set ansible_python_interpreter to use venv
      ansible.builtin.set_fact:
        ansible_python_interpreter: "{{ system_venv_path }}/bin/python"

    - name: Reset connection to apply new Python interpreter
      ansible.builtin.meta: reset_connection

    - name: Display configured Python interpreter
      ansible.builtin.debug:
        msg: "Ansible Python interpreter set to: {{ ansible_python_interpreter }}"
