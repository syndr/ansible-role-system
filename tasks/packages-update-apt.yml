---

- name: Configure package auto-update (apt)
  when: system_enable_packages_auto_update
  become: true
  block:
    - name: Install unattended-upgrades (shell fallback)
      when: __system_pkg_mgr_use_shell | default(false)
      block:
        - name: Update apt cache
          ansible.builtin.command:
            cmd: apt-get update -qq
          changed_when: false

        - name: Install unattended-upgrades via apt-get CLI
          ansible.builtin.command:
            cmd: apt-get install -y -qq unattended-upgrades
          register: __system_apt_auto_install_shell
          changed_when: "'is already the newest version' not in __system_apt_auto_install_shell.stdout"

    - name: Install unattended-upgrades
      when: not (__system_pkg_mgr_use_shell | default(false))
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true

    - name: Configure unattended-upgrades
      ansible.builtin.template:
        src: etc/apt/apt.conf.d/50unattended-upgrades.j2
        dest: /etc/apt/apt.conf.d/50unattended-upgrades
        owner: root
        group: root
        mode: '0644'

    - name: Configure APT periodic updates
      ansible.builtin.template:
        src: etc/apt/apt.conf.d/20auto-upgrades.j2
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start unattended-upgrades
      ansible.builtin.systemd:
        name: unattended-upgrades
        enabled: true
        state: started

- name: Disable package auto-update (apt)
  when: not system_enable_packages_auto_update
  become: true
  ansible.builtin.systemd:
    name: unattended-upgrades
    enabled: false
    state: stopped
  failed_when: false
