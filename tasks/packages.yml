---
# Install applications from the system package manager
# NOTE: ansible_python_interpreter is overridden via include params in main.yml
# to use the discovered package manager Python (__system_pkg_mgr_python)

- name: Install system packages (shell fallback)
  when:
    - __system_pkg_mgr_use_shell | default(false)
    - system_packages_base is truthy or system_packages_extra is truthy
  become: true
  block:
    - name: Packages are installed via dnf CLI
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version is version('8', '>=')
      ansible.builtin.command:
        cmd: "dnf install -y {{ (system_packages_base + system_packages_extra) | join(' ') }}"
      register: __system_pkg_install_shell
      changed_when: "'Nothing to do' not in __system_pkg_install_shell.stdout"

    - name: Packages are installed via yum CLI
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version is version('8', '<')
      ansible.builtin.command:
        cmd: "yum install -y {{ (system_packages_base + system_packages_extra) | join(' ') }}"
      register: __system_pkg_install_shell
      changed_when: "'Nothing to do' not in __system_pkg_install_shell.stdout"

    - name: Packages are installed via apt CLI
      when: ansible_os_family == "Debian"
      block:
        - name: Update apt cache
          ansible.builtin.command:
            cmd: apt-get update -qq
          changed_when: false

        - name: Install packages via apt-get CLI
          ansible.builtin.command:
            cmd: "apt-get install -y -qq {{ (system_packages_base + system_packages_extra) | join(' ') }}"
          register: __system_pkg_install_shell
          changed_when: "'0 newly installed' not in __system_pkg_install_shell.stdout"

- name: Install system packages
  when:
    - not (__system_pkg_mgr_use_shell | default(false))
    - system_packages_base is truthy or system_packages_extra is truthy
  become: true
  block:
    - name: Packages are installed (dnf)
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version is version('8', '>=')
      ansible.builtin.dnf:
        name: "{{ system_packages_base + system_packages_extra }}"
        state: present
        update_cache: true

    - name: Packages are installed (yum)
      when: ansible_os_family == "RedHat" and ansible_distribution_major_version is version('8', '<')
      ansible.builtin.yum:
        name: "{{ system_packages_base + system_packages_extra }}"
        state: present
        update_cache: true

    - name: Packages are installed (apt)
      when: ansible_os_family == "Debian"
      ansible.builtin.apt:
        name: "{{ system_packages_base + system_packages_extra }}"
        state: present
        update_cache: true
