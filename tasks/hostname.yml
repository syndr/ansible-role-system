---
# Set system hostname

- name: Validate hostname configuration
  ansible.builtin.assert:
    that:
      # provided hostname contains only valid characters
      - system_hostname is match("^[a-zA-Z0-9.-]+$")
    fail_msg: >-
      The provided system_hostname '{{ system_hostname }}' contains invalid characters.
      Only letters, numbers, dots, and hyphens are allowed.

- name: Set system hostname
  become: true
  vars:
    # Normalize to lowercase: DNS hostnames are case-insensitive, and uppercase
    # names break tooling that expects a canonical lowercase node name (e.g.
    # Proxmox VE node identity). There is no valid use case for an uppercase
    # hostname, so we always cast it down.
    __system_hostname: "{{ system_hostname | lower }}"
  ansible.builtin.hostname:
    name: "{{ __system_hostname }}"
    use: systemd
